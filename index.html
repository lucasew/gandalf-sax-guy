<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gandalf sax</title>
  <link rel="preload" href="giphy.webm" as="video">
  <link rel="preload" href="epicsaxguy.mp3" as="audio">
  <link rel="icon" id="favicon" href="favicon.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #gif-container {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }
    #gif-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      color: #f4c95d;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="gif-container">
    <video id="gif-video" src="giphy.webm" loop muted playsinline></video>
  </div>

  <div id="start-overlay">
    <div style="text-align:center; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="font-size: 2.2rem; font-weight: 700; letter-spacing: 6px; margin-bottom: 8px;">CLICK TO START</div>
      <div style="font-size: 0.8rem; opacity: 0.6; letter-spacing: 3px;">GANDALF SAX GUY — SYNCED</div>
      <div style="font-size:0.55rem; opacity:0.4; margin-top:10px; letter-spacing:1px;">
        <a href="https://github.com/lucasew/gandalf-sax-guy" target="_blank" rel="noopener noreferrer" style="color:#f4c95d; text-decoration:underline;">github.com/lucasew/gandalf-sax-guy</a>
      </div>
    </div>
  </div>

  <audio id="audio" src="epicsaxguy.mp3" loop preload="auto"></audio>

  <script>
    (function () {
      function reportError(error, context) {
        console.error(`[ErrorReporter] ${context || 'Unexpected error'}:`, error);
        // Centralized error reporting point (e.g., Sentry could be integrated here)
      }

      const DEFAULT_AUDIO_PERIOD = 29.71;
      const DEFAULT_VIDEO_DURATION = 0.44;
      const MS_PER_SEC = 1000;
      const CONVERGE_BOOST_NEW_EPOCH = 2500;
      const CONVERGE_BOOST_START = 9000;
      const CONVERGE_BOOST_INTERACT = 5500;
      const CONVERGE_BOOST_R_KEY = 6000;
      const CONVERGE_BOOST_VISIBILITY = 4500;
      const CONVERGE_BOOST_ENDED = 1800;
      const TIGHT_SYNC_DELAY_MS = 90;

      const FAVICON_SIZE = 32;
      const FAVICON_UPDATE_INTERVAL_MS = 66;
      const DEFAULT_VIDEO_WIDTH = 500;
      const DEFAULT_VIDEO_HEIGHT = 250;

      const AUDIO_MAX_AGGRESSIVE = 0.042;
      const AUDIO_MAX_NORMAL = 0.022;
      const AUDIO_GAIN_AGGRESSIVE = 0.20;
      const AUDIO_GAIN_NORMAL = 0.085;
      const AUDIO_ERR_THRESHOLD = 0.003;

      const VIDEO_MAX_AGGRESSIVE = 0.05;
      const VIDEO_MAX_NORMAL = 0.025;
      const VIDEO_GAIN_AGGRESSIVE = 0.22;
      const VIDEO_GAIN_NORMAL = 0.09;
      const VIDEO_ERR_THRESHOLD = 0.002;

      const audio = document.getElementById('audio');
      const gifContainer = document.getElementById('gif-container');
      const gifVideo = document.getElementById('gif-video');
      const startOverlay = document.getElementById('start-overlay');

      let period = DEFAULT_AUDIO_PERIOD;
      let lastEpoch = -1;
      let convergeUntil = 0;
      let rafId = null;
      let isPlaying = false;
      let started = false;
      let videoDur = DEFAULT_VIDEO_DURATION;

      if (gifVideo) {
        gifVideo.addEventListener('loadedmetadata', () => {
          if (gifVideo.duration > 0) videoDur = gifVideo.duration;
        });
      }

      // Favicon: paint current video frame onto a 32×32 canvas (~15 fps).
      const favicon = document.getElementById('favicon');
      const favCanvas = document.createElement('canvas');
      favCanvas.width = FAVICON_SIZE;
      favCanvas.height = FAVICON_SIZE;
      const favCtx = favCanvas.getContext('2d');
      let lastFavUpdate = 0;

      function updateFavicon() {
        const now = performance.now();
        if (now - lastFavUpdate < FAVICON_UPDATE_INTERVAL_MS) return;
        lastFavUpdate = now;
        if (!gifVideo || !favicon || gifVideo.readyState < 2) return;
        favCtx.clearRect(0, 0, FAVICON_SIZE, FAVICON_SIZE);
        const vw = gifVideo.videoWidth || DEFAULT_VIDEO_WIDTH;
        const vh = gifVideo.videoHeight || DEFAULT_VIDEO_HEIGHT;
        const scale = Math.max(FAVICON_SIZE / vw, FAVICON_SIZE / vh);
        const dw = vw * scale;
        const dh = vh * scale;
        const dx = (FAVICON_SIZE - dw) / 2;
        const dy = (FAVICON_SIZE - dh) / 2;
        favCtx.drawImage(gifVideo, dx, dy, dw, dh);
        try {
          favicon.href = favCanvas.toDataURL('image/png');
        } catch (err) {
          reportError(err, 'Failed to update favicon');
        }
      }

      function updateDuration(d) {
        if (isFinite(d) && d > 1) period = d;
      }
      audio.addEventListener('loadedmetadata', () => updateDuration(audio.duration));
      audio.addEventListener('durationchange', () => updateDuration(audio.duration));
      if (audio.readyState >= 1 && isFinite(audio.duration)) updateDuration(audio.duration);

      function getPhase() {
        const t = Date.now() / MS_PER_SEC;
        return ((t % period) + period) % period;
      }

      function boostConverge(ms) {
        const until = Date.now() + ms;
        if (until > convergeUntil) convergeUntil = until;
      }

      function tightSync() {
        if (!isPlaying) return;
        rafId = requestAnimationFrame(tightSync);

        const now = Date.now();
        const epoch = Math.floor(now / MS_PER_SEC / period);
        if (epoch !== lastEpoch) {
          lastEpoch = epoch;
          boostConverge(CONVERGE_BOOST_NEW_EPOCH);
        }

        const aggressive = now < convergeUntil;

        // Audio: nudge playbackRate toward wall-clock phase (no mid-play seeks).
        const aErr = getPhase() - audio.currentTime;
        const aMax = aggressive ? AUDIO_MAX_AGGRESSIVE : AUDIO_MAX_NORMAL;
        const aGain = aggressive ? AUDIO_GAIN_AGGRESSIVE : AUDIO_GAIN_NORMAL;
        audio.playbackRate = Math.abs(aErr) > AUDIO_ERR_THRESHOLD
          ? 1 + Math.max(-aMax, Math.min(aMax, aErr * aGain))
          : 1.0;

        // Video: same idea, slightly looser gains, shortest-path error across loop.
        if (gifVideo) {
          let gErr = (now / MS_PER_SEC % videoDur) - gifVideo.currentTime;
          if (gErr > videoDur / 2) gErr -= videoDur;
          if (gErr < -videoDur / 2) gErr += videoDur;
          const gMax = aggressive ? VIDEO_MAX_AGGRESSIVE : VIDEO_MAX_NORMAL;
          const gGain = aggressive ? VIDEO_GAIN_AGGRESSIVE : VIDEO_GAIN_NORMAL;
          gifVideo.playbackRate = Math.abs(gErr) > VIDEO_ERR_THRESHOLD
            ? 1 + Math.max(-gMax, Math.min(gMax, gErr * gGain))
            : 1.0;
        }
      }

      function startPlayback() {
        if (isPlaying) return;

        const phase = getPhase();
        audio.currentTime = phase;
        audio.playbackRate = 1.0;
        lastEpoch = Math.floor(Date.now() / MS_PER_SEC / period);

        audio.play().then(() => {
          isPlaying = true;
          started = true;
          if (startOverlay) startOverlay.style.display = 'none';
          if (gifVideo) gifVideo.play().catch((err) => {
            reportError(err, 'Failed to play video');
          });
          boostConverge(CONVERGE_BOOST_START);
          setTimeout(() => { if (isPlaying) tightSync(); }, TIGHT_SYNC_DELAY_MS);
        }).catch((err) => {
          started = false;
          reportError(err, 'Failed to start audio playback');
        });
      }

      function onInteract() {
        if (!started) {
          if (startOverlay) startOverlay.style.display = 'none';
          startPlayback();
        } else if (isPlaying) {
          boostConverge(CONVERGE_BOOST_INTERACT);
        }
      }

      gifContainer.addEventListener('click', onInteract);
      gifContainer.addEventListener('touchstart', onInteract, { passive: true });

      if (startOverlay) {
        startOverlay.addEventListener('click', onInteract);
        startOverlay.addEventListener('touchstart', onInteract, { passive: true });
        const repoLink = startOverlay.querySelector('a');
        if (repoLink) {
          repoLink.addEventListener('click', (e) => e.stopPropagation());
          repoLink.addEventListener('touchstart', (e) => e.stopPropagation());
        }
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          onInteract();
        }
        if (e.key.toLowerCase() === 'r' && isPlaying) {
          boostConverge(CONVERGE_BOOST_R_KEY);
        }
      });

      function prime() {
        try { audio.currentTime = getPhase(); } catch (err) {
          reportError(err, 'Failed to set audio phase in prime()');
        }
        if (gifVideo) {
          try { gifVideo.currentTime = (Date.now() / MS_PER_SEC) % videoDur; } catch (err) {
            reportError(err, 'Failed to set video phase in prime()');
          }
        }
      }
      prime();
      audio.addEventListener('loadedmetadata', () => { if (!isPlaying) prime(); });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isPlaying) {
          boostConverge(CONVERGE_BOOST_VISIBILITY);
          lastEpoch = Math.floor(Date.now() / MS_PER_SEC / period);
        }
      });

      audio.addEventListener('ended', () => {
        if (isPlaying) boostConverge(CONVERGE_BOOST_ENDED);
      });

      // Muted teaser before click; rate lock-in happens after startPlayback.
      if (gifVideo) {
        gifVideo.play().catch((err) => {
          reportError(err, 'Failed to play muted teaser video');
        });
      }

      function faviconLoop() {
        updateFavicon();
        requestAnimationFrame(faviconLoop);
      }
      faviconLoop();
    })();
  </script>
</body>
</html>
