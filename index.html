<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gandalf sax</title>
  <link rel="preload" href="giphy.webm" as="video">
  <link rel="preload" href="epicsaxguy.mp3" as="audio">
  <link rel="icon" id="favicon" href="favicon.png" type="image/png">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #gif-container {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }
    #gif-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      color: #f4c95d;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="gif-container">
    <video id="gif-video" src="giphy.webm" loop muted playsinline></video>
  </div>

  <div id="start-overlay">
    <div style="text-align:center; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="font-size: 2.2rem; font-weight: 700; letter-spacing: 6px; margin-bottom: 8px;">CLICK TO START</div>
      <div style="font-size: 0.8rem; opacity: 0.6; letter-spacing: 3px;">GANDALF SAX GUY — SYNCED</div>
      <div style="font-size:0.55rem; opacity:0.4; margin-top:10px; letter-spacing:1px;">
        <a href="https://github.com/lucasew/gandalf-sax-guy" target="_blank" rel="noopener noreferrer" style="color:#f4c95d; text-decoration:underline;">github.com/lucasew/gandalf-sax-guy</a>
      </div>
    </div>
  </div>

  <audio id="audio" src="epicsaxguy.mp3" loop preload="auto"></audio>

  <script>
    (function () {

      const ErrorReporter = {
        report: function(error, context) {
          // Centralized error reporting per project guidelines
          if (typeof Sentry !== 'undefined' && Sentry.captureException) {
            Sentry.captureException(error, { extra: context });
          } else {
            console.error('Captured by ErrorReporter:', error, context);
          }
        }
      };

      const audio = document.getElementById('audio');
      const gifContainer = document.getElementById('gif-container');
      const gifVideo = document.getElementById('gif-video');
      const startOverlay = document.getElementById('start-overlay');

      let period = 29.71;
      let lastEpoch = -1;
      let convergeUntil = 0;
      let rafId = null;
      let isPlaying = false;
      let started = false;
      let videoDur = 0.44;

      if (gifVideo) {
        gifVideo.addEventListener('loadedmetadata', () => {
          if (gifVideo.duration > 0) videoDur = gifVideo.duration;
        });
      }

      // Favicon: paint current video frame onto a 32×32 canvas (~15 fps).
      const favicon = document.getElementById('favicon');
      const favCanvas = document.createElement('canvas');
      favCanvas.width = 32;
      favCanvas.height = 32;
      const favCtx = favCanvas.getContext('2d');
      let lastFavUpdate = 0;

      function updateFavicon() {
        const now = performance.now();
        if (now - lastFavUpdate < 66) return;
        lastFavUpdate = now;
        if (!gifVideo || !favicon || gifVideo.readyState < 2) return;
        favCtx.clearRect(0, 0, 32, 32);
        const vw = gifVideo.videoWidth || 500;
        const vh = gifVideo.videoHeight || 250;
        const scale = Math.max(32 / vw, 32 / vh);
        const dw = vw * scale;
        const dh = vh * scale;
        const dx = (32 - dw) / 2;
        const dy = (32 - dh) / 2;
        favCtx.drawImage(gifVideo, dx, dy, dw, dh);
        try { favicon.href = favCanvas.toDataURL('image/png'); } catch (err) { ErrorReporter.report(err, { source: 'updateFavicon' }); }
      }

      function updateDuration(d) {
        if (isFinite(d) && d > 1) period = d;
      }
      audio.addEventListener('loadedmetadata', () => updateDuration(audio.duration));
      audio.addEventListener('durationchange', () => updateDuration(audio.duration));
      if (audio.readyState >= 1 && isFinite(audio.duration)) updateDuration(audio.duration);

      function getPhase() {
        const t = Date.now() / 1000;
        return ((t % period) + period) % period;
      }

      function boostConverge(ms) {
        const until = Date.now() + ms;
        if (until > convergeUntil) convergeUntil = until;
      }

      function tightSync() {
        if (!isPlaying) return;
        rafId = requestAnimationFrame(tightSync);

        const now = Date.now();
        const epoch = Math.floor(now / 1000 / period);
        if (epoch !== lastEpoch) {
          lastEpoch = epoch;
          boostConverge(2500);
        }

        const aggressive = now < convergeUntil;

        // Audio: nudge playbackRate toward wall-clock phase (no mid-play seeks).
        const aErr = getPhase() - audio.currentTime;
        const aMax = aggressive ? 0.042 : 0.022;
        const aGain = aggressive ? 0.20 : 0.085;
        audio.playbackRate = Math.abs(aErr) > 0.003
          ? 1 + Math.max(-aMax, Math.min(aMax, aErr * aGain))
          : 1.0;

        // Video: same idea, slightly looser gains, shortest-path error across loop.
        if (gifVideo) {
          let gErr = (now / 1000 % videoDur) - gifVideo.currentTime;
          if (gErr > videoDur / 2) gErr -= videoDur;
          if (gErr < -videoDur / 2) gErr += videoDur;
          const gMax = aggressive ? 0.05 : 0.025;
          const gGain = aggressive ? 0.22 : 0.09;
          gifVideo.playbackRate = Math.abs(gErr) > 0.002
            ? 1 + Math.max(-gMax, Math.min(gMax, gErr * gGain))
            : 1.0;
        }
      }

      function startPlayback() {
        if (isPlaying) return;

        const phase = getPhase();
        audio.currentTime = phase;
        audio.playbackRate = 1.0;
        lastEpoch = Math.floor(Date.now() / 1000 / period);

        audio.play().then(() => {
          isPlaying = true;
          started = true;
          if (startOverlay) startOverlay.style.display = 'none';
          if (gifVideo) gifVideo.play().catch((err) => { ErrorReporter.report(err, { source: 'gifVideo.play' }); });
          boostConverge(9000);
          setTimeout(() => { if (isPlaying) tightSync(); }, 90);
        }).catch((err) => {
          started = false;
          ErrorReporter.report(err, { source: 'audio.play' });
        });
      }

      function onInteract() {
        if (!started) {
          if (startOverlay) startOverlay.style.display = 'none';
          startPlayback();
        } else if (isPlaying) {
          boostConverge(5500);
        }
      }

      gifContainer.addEventListener('click', onInteract);
      gifContainer.addEventListener('touchstart', onInteract, { passive: true });

      if (startOverlay) {
        startOverlay.addEventListener('click', onInteract);
        startOverlay.addEventListener('touchstart', onInteract, { passive: true });
        const repoLink = startOverlay.querySelector('a');
        if (repoLink) {
          repoLink.addEventListener('click', (e) => e.stopPropagation());
          repoLink.addEventListener('touchstart', (e) => e.stopPropagation());
        }
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          onInteract();
        }
        if (e.key.toLowerCase() === 'r' && isPlaying) {
          boostConverge(6000);
        }
      });

      function prime() {
        try { audio.currentTime = getPhase(); } catch (err) { ErrorReporter.report(err, { source: 'prime:audio.currentTime' }); }
        if (gifVideo) {
          try { gifVideo.currentTime = (Date.now() / 1000) % videoDur; } catch (err) { ErrorReporter.report(err, { source: 'prime:gifVideo.currentTime' }); }
        }
      }
      prime();
      audio.addEventListener('loadedmetadata', () => { if (!isPlaying) prime(); });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isPlaying) {
          boostConverge(4500);
          lastEpoch = Math.floor(Date.now() / 1000 / period);
        }
      });

      audio.addEventListener('ended', () => {
        if (isPlaying) boostConverge(1800);
      });

      // Muted teaser before click; rate lock-in happens after startPlayback.
      if (gifVideo) gifVideo.play().catch((err) => { ErrorReporter.report(err, { source: 'gifVideo.play' }); });

      function faviconLoop() {
        updateFavicon();
        requestAnimationFrame(faviconLoop);
      }
      faviconLoop();
    })();
  </script>
</body>
</html>
