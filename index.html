<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>gandalf sax</title>
  <link rel="preload" href="giphy.gif" as="image" crossorigin="anonymous">
  <link rel="preload" href="epicsaxguy.mp3" as="audio" crossorigin="anonymous">
  <style>
    * { box-sizing: border-box; }
    html, body {
      margin: 0; padding: 0;
      height: 100%;
      background: #000;
      overflow: hidden;
    }
    #gif-container {
      position: fixed;
      inset: 0;
      background: #000;
      overflow: hidden;
      cursor: pointer;
    }
    #gif-container video {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
    }

    #start-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.75);
      color: #f4c95d;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 1000;
      font-size: 1rem;
      text-transform: uppercase;
      cursor: pointer;
    }
  </style>
</head>
<body>
  <div id="gif-container">
    <video id="gif-video" src="giphy.webm" loop muted playsinline></video>
  </div>

  <div id="start-overlay">
    <div style="text-align:center; font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;">
      <div style="font-size: 2.2rem; font-weight: 700; letter-spacing: 6px; margin-bottom: 8px;">CLICK TO START</div>
      <div style="font-size: 0.8rem; opacity: 0.6; letter-spacing: 3px;">GANDALF SAX GUY — SYNCED</div>
    </div>
  </div>

  <audio id="audio" src="epicsaxguy.mp3" preload="auto"></audio>

  <script>
    (function () {
      const audio = document.getElementById('audio');
      const gifContainer = document.getElementById('gif-container');
      const gifVideo = document.getElementById('gif-video');

      let period = 29.71;
      let lastEpoch = -1;
      let lastSync = 0;
      let convergeUntil = 0;
      let rafId = null;
      let isPlaying = false;
      let started = false;

      let GIF_DUR = 0.44;

      if (gifVideo) {
        gifVideo.addEventListener('loadedmetadata', () => {
          if (gifVideo.duration > 0) GIF_DUR = gifVideo.duration;
        });
      }

      function updateDuration(d) {
        if (isFinite(d) && d > 1) period = d;
      }
      audio.addEventListener('loadedmetadata', () => updateDuration(audio.duration));
      audio.addEventListener('durationchange', () => updateDuration(audio.duration));
      if (audio.readyState >= 1 && isFinite(audio.duration)) updateDuration(audio.duration);

      function getPhase() {
        const t = Date.now() / 1000;
        return ((t % period) + period) % period;
      }

      function tightSync() {
        if (!isPlaying) return;
        rafId = requestAnimationFrame(tightSync);

        const now = Date.now();

        const epoch = Math.floor(now / 1000 / period);
        if (epoch !== lastEpoch) {
          lastEpoch = epoch;
          const newUntil = now + 2500;
          if (newUntil > convergeUntil) {
            convergeUntil = newUntil;
            console.log(`[CONVERGE] epoch boost, convergeUntil in ${(convergeUntil - now)/1000}s`);
          }
        }

        if (now - lastSync < 80) {
          // still update GIF rate below
        } else {
          lastSync = now;
        }

        // Audio
        const ideal = getPhase();
        const error = ideal - audio.currentTime;

        const aggressive = now < convergeUntil;
        const maxDev = aggressive ? 0.042 : 0.022;
        const gain = aggressive ? 0.20 : 0.085;

        let rate = 1.0;
        if (Math.abs(error) > 0.003) {
          rate = 1 + Math.max(-maxDev, Math.min(maxDev, error * gain));
        }

        console.log(`[AUDIO RATE] t=${(now/1000).toFixed(3)} ideal=${ideal.toFixed(3)} curr=${audio.currentTime.toFixed(3)} err=${error.toFixed(4)} agg=${aggressive} maxDev=${maxDev} gain=${gain} → rate=${rate.toFixed(4)}`);
        audio.playbackRate = rate;

        // GIF video rate (only speed after initial currentTime set)
        if (gifVideo) {
          const gdur = GIF_DUR;
          const t = now / 1000;
          const gideal = (t % gdur);
          const gcurr = gifVideo.currentTime;
          let gerror = gideal - gcurr;
          if (gerror > gdur / 2) gerror -= gdur;
          if (gerror < -gdur / 2) gerror += gdur;

          const gmaxDev = aggressive ? 0.05 : 0.025;
          const ggain = aggressive ? 0.22 : 0.09;
          let grate = 1.0;
          if (Math.abs(gerror) > 0.002) {
            grate = 1 + Math.max(-gmaxDev, Math.min(gmaxDev, gerror * ggain));
          }
          gifVideo.playbackRate = grate;
          console.log(`[GIF RATE] t=${t.toFixed(3)} ideal=${gideal.toFixed(3)} curr=${gcurr.toFixed(3)} err=${gerror.toFixed(4)} agg=${aggressive} maxDev=${gmaxDev} gain=${ggain} → rate=${grate.toFixed(4)}`);
        }
      }

      function stopSync() {
        if (rafId) {
          cancelAnimationFrame(rafId);
          rafId = null;
        }
        audio.playbackRate = 1.0;
        if (gifVideo) gifVideo.playbackRate = 1.0;
      }

      function startPlayback() {
        if (isPlaying) return;

        const phase = getPhase();
        audio.currentTime = phase;
        audio.playbackRate = 1.0;
        lastEpoch = Math.floor(Date.now() / 1000 / period);
        console.log(`[INIT] audio initial phase=${phase.toFixed(3)} (wall t=${(Date.now()/1000).toFixed(3)})`);

        audio.play().then(() => {
          isPlaying = true;
          started = true;

          const overlay = document.getElementById('start-overlay');
          if (overlay) overlay.style.display = 'none';

          if (gifVideo) {
            gifVideo.play().catch(() => {});
          }

          convergeUntil = Date.now() + 9000;
          console.log(`[CONVERGE] initial play boost for 9s`);

          setTimeout(() => {
            if (isPlaying) tightSync();
          }, 90);
        }).catch(() => {
          started = false;
        });
      }

      function onInteract(e) {
        const overlay = document.getElementById('start-overlay');
        if (!started) {
          if (overlay) overlay.style.display = 'none';
          startPlayback();
        } else if (isPlaying) {
          convergeUntil = Date.now() + 5500;
          console.log(`[CONVERGE] manual resync boost`);
        }
      }

      gifContainer.addEventListener('click', onInteract);
      gifContainer.addEventListener('touchstart', onInteract, { passive: true });

      const startOverlay = document.getElementById('start-overlay');
      if (startOverlay) {
        startOverlay.addEventListener('click', onInteract);
        startOverlay.addEventListener('touchstart', onInteract, { passive: true });
      }

      document.addEventListener('keydown', (e) => {
        if (e.key === ' ' || e.key === 'Spacebar') {
          e.preventDefault();
          onInteract(e);
        }
        if (e.key.toLowerCase() === 'r' && isPlaying) {
          convergeUntil = Date.now() + 6000;
          console.log(`[CONVERGE] manual r resync boost`);
        }
      });

      function prime() {
        try { audio.currentTime = getPhase(); } catch (_) {}
        if (gifVideo) {
          try { gifVideo.currentTime = (Date.now() / 1000 % GIF_DUR); } catch (_) {}
        }
      }
      prime();
      audio.addEventListener('loadedmetadata', () => { if (!isPlaying) prime(); });

      document.addEventListener('visibilitychange', () => {
        if (document.visibilityState === 'visible' && isPlaying) {
          convergeUntil = Date.now() + 4500;
          lastEpoch = Math.floor(Date.now() / 1000 / period);
        }
      });

      audio.addEventListener('ended', () => {
        if (isPlaying) {
          convergeUntil = Date.now() + 1800;
          audio.currentTime = 0;
        }
      });

      window.GANDALF = { getPhase, getPeriod: () => period };

      // Auto play muted video as teaser (rate will be controlled after click)
      if (gifVideo) {
        gifVideo.play().catch(() => {});
      }
    })();
  </script>
</body>
</html>
